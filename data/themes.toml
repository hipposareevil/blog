# -- Site themes (wizard / space opera) --------------------------------------
# Runtime theme switcher. Visitors get a toggle button in the header; their
# choice is remembered in localStorage. `?theme=opera` in a URL forces a theme.
# Styling lives in assets/css/themes.css under html[data-theme="<name>"].
# Keys must stay lowercase.

default = "wizard"              # theme shown to first-time visitors
order   = ["wizard", "opera"]   # the toggle cycles through these

[wizard]
  label = "Wizard"              # the existing look - needs no overrides

[opera]
  label = "Space Opera"
  logo  = "img/opera/logo.png"  # replaces the header logo (path under assets/)

  # Swap any image whose src contains `match` (hard-coded <img src="/img/wizard_*.png"> in your layouts,
  # Blowfish hero images, ...). `to` is a path under assets/.
  [[opera.swap]]
    match = "/img/background"
    to    = "img/opera/hero-home.png"
  [[opera.swap]]
    match = "/img/default_featured"
    to    = "img/opera/default-featured.png"
  [[opera.swap]]
    match = "/img/wizard_archive"
    to    = "img/opera/archives.png"
  [[opera.swap]]
    match = "/img/wizard_tags"
    to    = "img/opera/tags.png"
  [[opera.swap]]
    match = "/img/wizard_category"
    to    = "img/opera/categories.png"
  [[opera.swap]]
    match = "/img/wizard_gazing"
    to    = "img/opera/gazing.png"
  [[opera.swap]]
    match = "/img/wizard_browse"
    to    = "img/opera/browse.png"
  [[opera.swap]]
    match = "/img/wizard_panoramic"
    to    = "img/opera/panoramic.png"
  [[opera.swap]]
    match = "/img/wizard_bike_trip"
    to    = "img/opera/bike-trip.png"
  [[opera.swap]]
    match = "/img/browse_tags"
    to    = "img/opera/tags.png"
  [[opera.swap]]
    match = "/img/browse_archives"
    to    = "img/opera/archives.png"
  [[opera.swap]]
    match = "/img/browse_categories"
    to    = "img/opera/categories.png"
  [[opera.swap]]
    match = "/img/browse_panoramic"
    to    = "img/opera/panoramic.png"

  # Per-page art: add  featureimageopera = "img/opera/archives.png"
  # to a page's front matter (e.g. content/archives/_index.md).
